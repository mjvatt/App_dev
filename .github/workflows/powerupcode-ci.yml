name: PowerUpCode CI

on:
  push:
    branches: [main, develop]
    paths:
      - "powerupcode/**"
      - ".github/workflows/powerupcode-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "powerupcode/**"
      - ".github/workflows/powerupcode-ci.yml"

defaults:
  run:
    working-directory: powerupcode

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: powerupcode/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check api services tests

      - name: Type-check
        run: mypy api services

      - name: Test
        env:
          # Integration tests boot Postgres via testcontainers; this URL
          # is only used as a fallback for unit tests that don't depend
          # on the pg_url fixture.
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/powerupcode_test
          SECRET_KEY: ci-secret
          ENGINE_MODULE: stub
        run: pytest --cov=api --cov=services --cov-report=xml -q

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: powerupcode/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - name: Build (uploads source maps to Sentry when secrets are set)
        run: npm run build
        env:
          # SENTRY_AUTH_TOKEN must be set as a GitHub Actions secret;
          # SENTRY_ORG and SENTRY_PROJECT can be either secrets or
          # repository variables. When any of them are missing the
          # withSentryConfig plugin no-ops and the build still succeeds.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
