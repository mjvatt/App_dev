name: Deploy Fourth & Infinite to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/NFL Analytics/fourth-infinite/**'
      - '.github/workflows/deploy-fourth-infinite.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node (for js syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run smoke test
        working-directory: 'Frontend/NFL Analytics/fourth-infinite'
        run: python smoke_test.py

  deploy:
    needs: smoke
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Frontend/NFL Analytics/fourth-infinite'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
