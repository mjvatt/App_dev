services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pathfinder-postgres
    environment:
      POSTGRES_USER: pathfinder
      POSTGRES_PASSWORD: pathfinder
      POSTGRES_DB: pathfinder
    ports:
      - "5436:5432"
    volumes:
      - pathfinder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pathfinder-pgdata:
