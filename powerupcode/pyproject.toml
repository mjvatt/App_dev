[project]
name = "powerupcode-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "anthropic>=0.40",
    "stripe>=9.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "aiosmtplib>=3.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0",
    "posthog>=3.5,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "testcontainers[postgres]>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# challenge_bank.py is a fixture of narrative content (problem statements,
# constraints, examples). Wrapping the long descriptive strings adds zero
# value to the reader and makes diffs noisier. challenge_generator.py
# contains a Haiku system prompt where line shape is meaningful (the model
# sees it verbatim).
"services/engine_core/challenge_bank.py" = ["E501"]
"services/engine_core/challenge_generator.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
# Stripe and slowapi ship loose types and don't pay for strict checking.
module = ["stripe.*", "slowapi.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Boundary modules that interop with the loose Stripe SDK; checking the
# rest of the code is more valuable than fighting Stripe's typing here.
module = ["services.billing.stripe_client", "api.routers.billing"]
ignore_errors = true

[[tool.mypy.overrides]]
# engine_core is gitignored (proprietary) so it's absent in CI checkouts,
# but locally we still want it type-checked. Anthropic SDK content blocks
# union over many subtypes that don't all carry .text, so allow follow-imports
# to fall through silently and lean on isinstance checks in the code itself.
module = ["services.engine_core.*"]
follow_imports = "silent"
