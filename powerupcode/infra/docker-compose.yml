services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: powerupcode
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db/powerupcode
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      ENGINE_MODULE: stub
    depends_on:
      db:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ../api
          target: /app/api
        - action: sync
          path: ../services
          target: /app/services

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
